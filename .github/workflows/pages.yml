name: Deploy Schooltopia

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: node test.js

      - name: Prepare public site
        run: |
          mkdir -p _site/vendor
          cp index.html styles.css i18n.js shared-config.js schooltopia.js run-recap.js game.js _site/
          cp creator.html admin.css creator.css creator.js creator-audio.js event-generator.js _site/
          cp creator-3d-loader.js creator-3d.bundle.js _site/
          cp share-cover.png share-cover.svg .nojekyll _site/
          cp vendor/three.core.min.js vendor/three.module.min.js _site/vendor/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
